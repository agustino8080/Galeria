<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TiNo Cloud Gallery — Premium Storage</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f111a;
            --card-bg: #1a1c26;
            --accent: #00f2ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg);
            color: #fff;
            padding: 20px;
        }

        /* BARRA DE FILTROS SUPERIOR */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            position: sticky;
            top: 10px;
            z-index: 100;
        }

        .filter-btn {
            background: rgba(40, 44, 55, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 12px;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            font-weight: 600;
            font-size: 1rem;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
        }

        /* GRILLA MASONRY */
        .gallery-container {
            columns: 4;
            column-gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) { .gallery-container { columns: 3; } }
        @media (max-width: 768px) { .gallery-container { columns: 2; } }
        @media (max-width: 480px) { .gallery-container { columns: 1; } }

        .gallery-item {
            position: relative;
            margin-bottom: 15px;
            border-radius: 15px;
            overflow: hidden;
            background: var(--card-bg);
            break-inside: avoid;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .gallery-item img, .gallery-item video {
            width: 100%;
            display: block;
            transition: 0.5s;
        }

        /* OVERLAY INTERACTIVO (COMO LA CAPTURA) */
        .item-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.3s;
            backdrop-filter: blur(2px);
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .action-menu {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }

        .action-menu i {
            font-size: 1.5rem;
            color: #fff;
            transition: 0.3s;
        }

        .action-menu i:hover {
            color: var(--accent);
            transform: scale(1.2);
        }

        /* BOTÓN DE SUBIDA FLOTANTE */
        .upload-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1.8rem;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
            cursor: pointer;
            z-index: 200;
            transition: 0.3s;
        }

        .upload-fab:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* ETIQUETA VIDEO */
        .video-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <nav class="filter-bar">
        <button class="filter-btn active">Todo</button>
        <button class="filter-btn">Recientes</button>
        <button class="filter-btn">Favoritos</button>
        <button class="filter-btn">Videos</button>
        <button class="filter-btn">Carpetas</button>
    </nav>

    <div class="gallery-container" id="gallery">
        <!-- Los elementos se cargan dinámicamente -->
    </div>

    <div class="upload-fab" onclick="document.getElementById('fileInput').click()">
        <i class="fas fa-plus"></i>
    </div>
    <input type="file" id="fileInput" hidden multiple accept="image/*,video/*">

    <script>
        // Simulamos algunos datos para visualizar el diseño de la captura 2
        const dummyData = [
            { type: 'img', url: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=800' },
            { type: 'img', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=800' },
            { type: 'vid', url: 'https://www.w3schools.com/html/mov_bbb.mp4' },
            { type: 'img', url: 'https://images.unsplash.com/photo-1434725039720-abb260032913?q=80&w=800' },
            { type: 'img', url: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=800' },
            { type: 'img', url: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=800' },
            { type: 'vid', url: 'https://www.w3schools.com/html/movie.mp4' },
            { type: 'img', url: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=800' }
        ];

        const gallery = document.getElementById('gallery');

        function renderGallery() {
            dummyData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                
                let content = '';
                if(item.type === 'img') {
                    content = `<img src="${item.url}" alt="Gallery Image">`;
                } else {
                    content = `
                        <div class="video-tag">VIDEO</div>
                        <video src="${item.url}" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                    `;
                }

                div.innerHTML = `
                    ${content}
                    <div class="item-overlay">
                        <div class="action-menu">
                            <i class="fas fa-search"></i>
                            <i class="fas fa-download"></i>
                            <i class="fas fa-share-alt"></i>
                        </div>
                    </div>
                `;
                gallery.appendChild(div);
            });
        }

        renderGallery();

        // Lógica de subida (Solo visual por ahora)
        document.getElementById('fileInput').onchange = (e) => {
            const files = e.target.files;
            alert(`Sincronizando ${files.length} archivos con el servidor...`);
            // Aquí conectarás con la API de Cloudflare/Supabase
        };
    </script>
</body>
</html>
